name: Reusable Build

on:
  workflow_call:
    inputs:
      application-name:
        required: true
        type: string

    secrets:
      demo-secret:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        run: |
          echo "Building application: ${{ inputs.application-name }}"
          mkdir build
          echo "Hello from ${{ inputs.application-name }}" > build/app.txt

      - name: Check secret
        run: |
          if [ -n "${{ secrets.demo-secret }}" ]; then
            echo "Secret was received successfully"
          else
            echo "Secret was not received"
            exit 1
          fi
