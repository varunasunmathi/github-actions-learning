name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create application package
        run: |
          mkdir build
          echo "Hello from my application" > build/app.txt
          zip -r application.zip build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-package
          path: application.zip


  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: application-package

      - name: Show artifact
        run: |
          ls -la
          unzip -l application.zip

      - name: Test application
        run: echo "Testing application package..."
